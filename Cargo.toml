[package]
name = "tui_setup_wizard"
description = "A library to add quick tui setup wizards to rust applications"
license = "MIT"
homepage = "https://github.com/FizzyApple12/tui-setup-wizard/"
repository = "https://github.com/FizzyApple12/tui-setup-wizard/"
readme = "README.md"
version = "0.1.0"
edition = "2024"

[dependencies]
thiserror = "2"
ratatui = "0.30"
crossterm = "0.29"

[lints.rust]
async_fn_in_trait = "allow"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

indexing_slicing = "warn"
undocumented_unsafe_blocks = "warn"

large_enum_variant = "allow"
match_wildcard_for_single_variants = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
result_large_err = "allow"
zero_sized_map_values = "allow"
too_many_lines = "allow"
return_self_not_must_use = "allow"
